name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval
      - run: pytest -q

  retrieval-eval:
    # regression gate: rebuild the index from the official SEBI documents and fail if retrieval quality drops
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: fundlens setup
      - run: python -m eval.run_eval --retrieval-only
      - name: Gate on hybrid recall@5
        run: |
          python - <<'PY'
          import json
          r = json.load(open("reports/eval_retrieval.json"))["retrieval"]["hybrid"]
          print(r)
          assert r["recall_at_k"] >= 0.9, f"hybrid recall@5 fell to {r['recall_at_k']}"
          PY
